[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-metrics"
version = "0.1.0"
description = "Local telemetry, latency roofline, and offline cost/credits dashboard plugin for Antigravity Desktop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Gao" }]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://github.com/davidgao/agy-metrics"
Repository = "https://github.com/davidgao/agy-metrics"

[tool.setuptools.packages.find]
include = ["agy_metrics*"]
